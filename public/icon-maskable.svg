<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- VocaCurve (maskable, content kept inside the circular safe zone): stacked word cards on the app's paper background; behind them a rising memory curve with review points -->
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#1E1C19" flood-opacity="0.16"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2B4C7E" stop-opacity="0.15"/>
      <stop offset="0.35" stop-color="#2F64C8"/>
      <stop offset="1" stop-color="#3D86F0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#F7F5F0"/>
  <g transform="translate(256 256) scale(0.76) translate(-256 -256)">
    <!-- memory curve (behind the cards) -->
    <path d="M40 250 C 60 208, 84 190, 112 184 C 180 172, 268 162, 330 138 C 380 118, 410 97, 436 72"
          fill="none" stroke="#3D86F0" stroke-width="16" stroke-linecap="round" opacity="0.28" filter="url(#glow)"/>
    <path d="M40 250 C 60 208, 84 190, 112 184 C 180 172, 268 162, 330 138 C 380 118, 410 97, 436 72"
          fill="none" stroke="url(#curve)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="112" cy="184" r="8" fill="#FFFFFF" stroke="#2F64C8" stroke-width="4"/>
    <circle cx="224" cy="166" r="9" fill="#FFFFFF" stroke="#2F64C8" stroke-width="4"/>
    <circle cx="330" cy="138" r="10" fill="#FFFFFF" stroke="#3473DC" stroke-width="4"/>
    <circle cx="436" cy="72" r="22" fill="#3D86F0" opacity="0.35" filter="url(#glow)"/>
    <circle cx="436" cy="72" r="13" fill="#FFFFFF" stroke="#3D86F0" stroke-width="5"/>

    <!-- stacked cards -->
    <g transform="rotate(-12 222 350)" filter="url(#shadow)">
      <rect x="62" y="258" width="320" height="184" rx="24" fill="#A9C1E8"/>
    </g>
    <g transform="rotate(-9 240 306)" filter="url(#shadow)">
      <rect x="74" y="214" width="332" height="186" rx="24" fill="#DCE5F6"/>
    </g>
    <g transform="rotate(-6 282 262)" filter="url(#shadow)">
      <rect x="108" y="166" width="348" height="194" rx="26" fill="#FFFFFF"/>
      <g stroke="#C3CBE0" stroke-width="5" stroke-linecap="round">
        <line x1="152" y1="212" x2="412" y2="212"/>
        <line x1="152" y1="248" x2="412" y2="248"/>
        <line x1="152" y1="284" x2="412" y2="284"/>
        <line x1="152" y1="320" x2="412" y2="320"/>
      </g>
    </g>
  </g>
</svg>
