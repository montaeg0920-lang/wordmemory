<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: 100% full-bleed vibrant electric & royal blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="35%" stop-color="#0050EB" />
      <stop offset="70%" stop-color="#003BD1" />
      <stop offset="100%" stop-color="#0022A3" />
    </linearGradient>

    <!-- Top-Right Specular Ambient Glow -->
    <radialGradient id="topRightGlow" cx="82%" cy="14%" r="62%">
      <stop offset="0%" stop-color="#40C8FF" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#0066FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0029B8" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom-Left Ambient Glow -->
    <radialGradient id="bottomGlow" cx="18%" cy="86%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.4" />
      <stop offset="65%" stop-color="#003BD1" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter for Curve and Axes -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur1" />
      <feGaussianBlur stdDeviation="2.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft 3D Shadow for Cards -->
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#00104A" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#001866" flood-opacity="0.4" />
    </filter>

    <filter id="subtleCardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#00104A" flood-opacity="0.38" />
    </filter>

    <!-- Top Card Linear Gradient -->
    <linearGradient id="topCardGrad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F2F7FF" />
      <stop offset="100%" stop-color="#E2EEFC" />
    </linearGradient>

    <!-- Middle Card Gradient -->
    <linearGradient id="midCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4F0FF" />
      <stop offset="100%" stop-color="#B8D7FC" />
    </linearGradient>

    <!-- Bottom Card Gradient -->
    <linearGradient id="botCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5DFFF" />
      <stop offset="100%" stop-color="#8EBEFA" />
    </linearGradient>

    <!-- Curve Neon Stroke Gradient -->
    <linearGradient id="curveNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="15%" stop-color="#70E5FF" />
      <stop offset="60%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#0091FF" />
    </linearGradient>
  </defs>

  <!-- 1. FULL-BLEED SEAMLESS BLUE BACKGROUND (100% filled, no inner squircle clipping) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <rect width="512" height="512" fill="url(#topRightGlow)" />
  <rect width="512" height="512" fill="url(#bottomGlow)" />

  <!-- ================= GRAPH AXES & FORGETTING CURVE (SAFE-ZONE ALIGNED) ================= -->
  <!-- Vertical Axis (세로선: safe-zone at x=124, from y=98 to y=380, fully inside launcher squircle) -->
  <line x1="124" y1="380" x2="124" y2="102" stroke="#00D4FF" stroke-width="4.5" stroke-linecap="round" opacity="0.9" filter="url(#neonGlow)" />
  <!-- Vertical Arrow Head (세로선 상단 화살표) -->
  <polygon points="124,84 115,106 124,101 133,106" fill="#00E5FF" filter="url(#neonGlow)" />

  <!-- Horizontal Axis (가로선: safe-zone at y=380, from x=124 to x=396) -->
  <line x1="124" y1="380" x2="396" y2="380" stroke="#00D4FF" stroke-width="4.5" stroke-linecap="round" opacity="0.9" filter="url(#neonGlow)" />
  <!-- Horizontal Arrow Head (가로선 우측 화살표) -->
  <polygon points="412,380 390,371 395,380 390,389" fill="#00E5FF" filter="url(#neonGlow)" />

  <!-- Vertical Dashed Grid Drops under the Forgetting Curve -->
  <line x1="148" y1="124" x2="148" y2="215" stroke="#00E5FF" stroke-width="2.2" stroke-dasharray="5,6" stroke-opacity="0.55" filter="url(#neonGlow)" />
  <line x1="188" y1="144" x2="188" y2="215" stroke="#00E5FF" stroke-width="2.2" stroke-dasharray="5,6" stroke-opacity="0.55" filter="url(#neonGlow)" />
  <line x1="236" y1="162" x2="236" y2="200" stroke="#00E5FF" stroke-width="2.2" stroke-dasharray="5,6" stroke-opacity="0.45" filter="url(#neonGlow)" />
  <line x1="294" y1="175" x2="294" y2="195" stroke="#00E5FF" stroke-width="2.2" stroke-dasharray="5,6" stroke-opacity="0.45" filter="url(#neonGlow)" />
  <line x1="356" y1="184" x2="356" y2="225" stroke="#00E5FF" stroke-width="2.2" stroke-dasharray="5,6" stroke-opacity="0.45" filter="url(#neonGlow)" />

  <!-- The Glowing Exponential Forgetting Curve Arc -->
  <!-- Ambient Wide Glow -->
  <path d="M 124 100 C 142 128, 185 160, 268 180 C 330 191, 382 193, 420 191"
        fill="none" stroke="#00E5FF" stroke-width="11" stroke-linecap="round" opacity="0.38" filter="url(#neonGlow)" />

  <!-- Bright Core Neon Curve -->
  <path d="M 124 100 C 142 128, 185 160, 268 180 C 330 191, 382 193, 420 191"
        fill="none" stroke="url(#curveNeon)" stroke-width="5.5" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Pure White Intense Center Line -->
  <path d="M 124 100 C 142 128, 185 160, 268 180 C 330 191, 382 193, 420 191"
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />

  <!-- ================= ENLARGED 3D FLASHCARD STACK ================= -->
  <!-- Card 1: Bottom Layer Card (Slight counter-clockwise tilt) -->
  <g transform="translate(100, 222) rotate(-5.5)">
    <rect x="0" y="0" width="295" height="175" rx="26" fill="url(#botCardGrad)" filter="url(#subtleCardShadow)" />
    <rect x="1.5" y="1.5" width="292" height="172" rx="24.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.45" />
  </g>

  <!-- Card 2: Middle Layer Card (Subtle bridge angle) -->
  <g transform="translate(122, 198) rotate(-2.5)">
    <rect x="0" y="0" width="295" height="175" rx="26" fill="url(#midCardGrad)" filter="url(#subtleCardShadow)" />
    <rect x="1.5" y="1.5" width="292" height="172" rx="24.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6" />
  </g>

  <!-- Card 3: Top Layer Card (Front and center, crisp white) -->
  <g transform="translate(118, 175)">
    <!-- Main Drop Shadow -->
    <rect x="0" y="0" width="296" height="178" rx="27" fill="url(#topCardGrad)" filter="url(#cardShadow)" />

    <!-- 3D Beveled Highlight Border -->
    <rect x="1.5" y="1.5" width="293" height="175" rx="25.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    <rect x="3" y="3" width="290" height="172" rx="24" fill="none" stroke="#CBDCF8" stroke-width="1" stroke-opacity="0.75" />

    <!-- Debossed Flashcard Writing Lines -->
    <line x1="48" y1="42" x2="252" y2="42" stroke="#9BB8E4" stroke-width="5" stroke-linecap="round" />
    <line x1="48" y1="43" x2="252" y2="43" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

    <line x1="48" y1="72" x2="248" y2="72" stroke="#9BB8E4" stroke-width="5" stroke-linecap="round" />
    <line x1="48" y1="73" x2="248" y2="73" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

    <line x1="48" y1="102" x2="244" y2="102" stroke="#9BB8E4" stroke-width="5" stroke-linecap="round" />
    <line x1="48" y1="103" x2="244" y2="103" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

    <line x1="48" y1="132" x2="240" y2="132" stroke="#9BB8E4" stroke-width="5" stroke-linecap="round" />
    <line x1="48" y1="133" x2="240" y2="133" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>
